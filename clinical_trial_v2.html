<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clinical Trial Finder v2</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
    }

    /* ── header ── */
    header {
      background: #0e1f38;
      border-bottom: 1px solid #1d4b8a;
      padding: 1.2rem 2rem;
    }
    header h1 { font-size: 1.65rem; font-weight: 700; letter-spacing: -0.3px; }
    header p  { color: #8b949e; margin-top: 0.3rem; font-size: 0.88rem; }

    /* ── control bar ── */
    .control-bar {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 1rem 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label {
      font-size: 0.7rem;
      font-weight: 700;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    input, select {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      padding: 0.4rem 0.75rem;
      font-size: 0.9rem;
      height: 38px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.12);
    }
    select#condition { min-width: 270px; }
    input#zip        { width: 110px; }
    select#miles     { width: 145px; }

    #run-btn {
      height: 38px;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0 1.4rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s, transform 0.1s;
      white-space: nowrap;
    }
    #run-btn:hover    { background: #2ea043; }
    #run-btn:active   { transform: scale(0.97); }
    #run-btn:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

    /* ── main layout ── */
    main {
      display: flex;
      gap: 1.25rem;
      padding: 1.4rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ── agent log column ── */
    #agent-log-col { flex: 0 0 320px; display: flex; flex-direction: column; gap: 0.55rem; }
    #agent-log-col h2 { font-size: 0.8rem; font-weight: 700; color: #8b949e; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.2rem; }

    /* ── results column ── */
    #results-col { flex: 1 1 0; min-width: 0; }
    #results-col h2 { font-size: 0.8rem; font-weight: 700; color: #8b949e; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.5rem; }

    /* ── cards ── */
    .card {
      border-radius: 10px;
      padding: 0.8rem 1rem;
      border: 1px solid transparent;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .card.visible { opacity: 1; transform: translateY(0); }

    .card-user   { background: #161b22; border-color: #30363d; }
    .card-claude { background: #0e1f38; border-color: #1d4b8a; }
    .card-tool   { background: #141c14; border-color: #2a4a2a; }
    .card-data   { background: #1c1410; border-color: #5a3a10; }
    .card-done   { background: #0f1f14; border-color: #1a6b30; }
    .card-error  { background: #1f0e0e; border-color: #6b1a1a; }

    .card-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      margin-bottom: 0.38rem;
      opacity: 0.75;
    }
    .card-user   .card-label { color: #58a6ff; }
    .card-claude .card-label { color: #79c0ff; }
    .card-tool   .card-label { color: #56d364; }
    .card-data   .card-label { color: #e3b341; }
    .card-done   .card-label { color: #3fb950; }
    .card-error  .card-label { color: #f85149; }

    .card-body { font-size: 0.85rem; line-height: 1.6; white-space: pre-wrap; }

    /* ── results output ── */
    #output {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1rem 1.2rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.84rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-wrap: break-word;
      color: #e6edf3;
      min-height: 300px;
      max-height: 72vh;
      overflow-y: auto;
    }
    #output:empty::before {
      content: 'AI-generated trial summaries will appear here…';
      color: #484f58;
      font-style: italic;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* ── spinner ── */
    .thinking { display: inline-flex; align-items: center; gap: 0.45rem; color: #8b949e; font-size: 0.88rem; }
    .spinner {
      width: 13px; height: 13px;
      border: 2px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      text-align: center;
      color: #484f58;
      font-size: 0.77rem;
      padding: 2rem;
      border-top: 1px solid #21262d;
      margin-top: 1rem;
    }

    @media (max-width: 800px) {
      main { flex-direction: column; padding: 1rem; }
      #agent-log-col { flex: none; }
      .control-bar { padding: 1rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>🏥 Clinical Trial Finder <sup style="font-size:.55em;opacity:.7">v2</sup></h1>
  <p>Powered by Anthropic <code>claude-opus-4-6</code> · Live data from ClinicalTrials.gov · 5-line plain-English summaries</p>
</header>

<div class="control-bar">
  <div class="field">
    <label for="condition">Medical Condition</label>
    <select id="condition"><option value="">Loading conditions…</option></select>
  </div>
  <div class="field">
    <label for="zip">ZIP Code</label>
    <input type="text" id="zip" placeholder="e.g. 90210" maxlength="5" />
  </div>
  <div class="field">
    <label for="miles">Search Radius</label>
    <select id="miles">
      <option value="50">50 miles</option>
      <option value="100">100 miles</option>
      <option value="150">150 miles</option>
      <option value="200">200 miles</option>
    </select>
  </div>
  <button id="run-btn" onclick="findTrials()">🔍&nbsp; Find Trials</button>
</div>

<main>
  <div id="agent-log-col">
    <h2>Agent Activity</h2>
    <div id="agent-log"></div>
  </div>
  <div id="results-col">
    <h2>Results</h2>
    <div id="output"></div>
  </div>
</main>

<footer>
  Clinical Trial Finder v2 &nbsp;·&nbsp; Anthropic <code>claude-opus-4-6</code>
  &nbsp;·&nbsp; ClinicalTrials.gov API v2 &nbsp;·&nbsp; Served by <code>clinical_trial_v2.py</code>
</footer>

<script>
// ── Load condition dropdown ────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  const sel = document.getElementById('condition');
  try {
    const r    = await fetch('/api/conditions');
    const data = await r.json();
    sel.innerHTML = data.conditions
      .map(c => `<option value="${esc(c)}">${esc(c)}</option>`)
      .join('');
  } catch {
    sel.innerHTML = '<option value="">Failed to load — is the server running?</option>';
  }
});

// ── UI helpers ────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function makeCard(type, emoji, label, text) {
  const log  = document.getElementById('agent-log');
  const wrap = document.createElement('div');
  wrap.className = `card card-${type}`;

  const lbl = document.createElement('div');
  lbl.className   = 'card-label';
  lbl.textContent = `${emoji}  ${label}`;

  const body = document.createElement('div');
  body.className   = 'card-body';
  body.textContent = text;

  wrap.appendChild(lbl);
  wrap.appendChild(body);
  log.appendChild(wrap);
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('visible')));
  return wrap;
}

function addSpinner(msg) {
  removeSpinner();
  const log  = document.getElementById('agent-log');
  const wrap = document.createElement('div');
  wrap.className = 'card card-claude';
  wrap.id        = 'spinner-card';
  wrap.innerHTML = `<div class="card-body"><div class="thinking"><div class="spinner"></div> ${esc(msg)}</div></div>`;
  log.appendChild(wrap);
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('visible')));
}

function removeSpinner() {
  const s = document.getElementById('spinner-card');
  if (s) s.remove();
}

function appendOutput(text) {
  const out = document.getElementById('output');
  out.textContent += text;
  out.scrollTop = out.scrollHeight;
}

// ── Main search — calls Flask backend via SSE ─────────────────────────────────
async function findTrials() {
  const condition = document.getElementById('condition').value.trim();
  const zip       = document.getElementById('zip').value.trim();
  const miles     = document.getElementById('miles').value;

  if (!condition)             { alert('Please select a medical condition.'); return; }
  if (!/^\d{5}$/.test(zip))  { alert('Please enter a valid 5-digit ZIP code.'); return; }

  const btn = document.getElementById('run-btn');
  btn.disabled    = true;
  btn.textContent = '⏳ Searching…';

  document.getElementById('agent-log').innerHTML = '';
  document.getElementById('output').textContent  = '';

  makeCard('user', '🧑', 'Search Request',
    `Condition : ${condition}\nZIP code  : ${zip}\nRadius    : ${miles} miles`);

  addSpinner('Querying ClinicalTrials.gov…');

  const url = `/api/search?condition=${encodeURIComponent(condition)}&zipcode=${encodeURIComponent(zip)}&miles=${miles}`;
  const es  = new EventSource(url);

  es.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    if (msg.event === 'status') {
      removeSpinner();
      // Surface agent status messages as activity cards
      const text = msg.text.trim();
      if (text.startsWith('🤖')) {
        makeCard('claude', '🤖', 'Agent Started', text.replace(/^🤖\s*/, ''));
        addSpinner('Claude is thinking…');
      } else if (text.startsWith('🛠')) {
        removeSpinner();
        makeCard('tool', '🔧', 'Tool Called', text.replace(/^🛠\s*/, ''));
        addSpinner('Querying ClinicalTrials.gov…');
      } else if (text.startsWith('✅')) {
        removeSpinner();
        makeCard('data', '📦', 'Data Returned', text.replace(/^✅\s*/, ''));
        addSpinner('Claude is writing summaries…');
      }
      return;
    }

    if (msg.event === 'text') {
      removeSpinner();
      appendOutput(msg.text);
      return;
    }

    if (msg.event === 'done') {
      removeSpinner();
      es.close();
      makeCard('done', '✅', 'Agent Complete', 'Agentic loop finished — end_turn reached.');
      btn.disabled    = false;
      btn.textContent = '🔍\u00A0 Find Trials';
      return;
    }

    if (msg.event === 'error') {
      removeSpinner();
      es.close();
      makeCard('error', '❌', 'Error', msg.text);
      appendOutput('\n❌ ' + msg.text + '\n');
      btn.disabled    = false;
      btn.textContent = '🔍\u00A0 Find Trials';
    }
  };

  es.onerror = () => {
    removeSpinner();
    es.close();
    makeCard('error', '❌', 'Connection Error',
      'Lost connection to server. Is clinical_trial_v2.py running?');
    btn.disabled    = false;
    btn.textContent = '🔍\u00A0 Find Trials';
  };
}
</script>
</body>
</html>
